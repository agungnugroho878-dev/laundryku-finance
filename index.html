<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>LAMAN</title>
<meta name="description" content="Aplikasi laporan keuangan sederhana untuk UMKM laundry: catat kas masuk/keluar, lihat Laba Rugi dan Neraca otomatis.">
<meta name="theme-color" content="#16232E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LaundryKu">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div id="app" style="display:none;">
  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M8 4.5v11.2c0 1.1.9 2 2 2h5.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16.5" cy="17" r="2" fill="#F2B25A"/>
        </svg>
      </div>
      <div class="titles">
        <div class="biz-name">LAMAN</div>
        <div class="tagline" id="bizName">Laporan keuangan UMKM laundry</div>
      </div>
    </div>
  </header>

  <div class="app-body" id="appBody">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="app-main" id="appMain"></main>
  </div>

  <button class="fab-quick-action" id="fabQuickAction" aria-label="Aksi Cepat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<!-- Firebase (compat build — works as plain scripts, no bundler needed) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/db.js"></script>
<script src="js/reports.js"></script>
<script src="js/app.js"></script>
</body>
</html>
